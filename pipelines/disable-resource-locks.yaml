name: "azure-resource-locks - disable"

# Docs:
# https://aka.ms/yaml
trigger: none
# Don't run against PRs
pr: none
 
parameters:
  - name: subscription
    displayName: Subscription
    type: string
    default: DCD-CNP-DEV-WIF
    values:
    - 'DCD-CNP-DEV-WIF'
    - 'DCD-CNP-QA-WIF'
    - 'DCD-CNP-Prod-WIF'
    - 'DTS-SHAREDSERVICES-DEV-WIF'
    - 'DTS-SHAREDSERVICES-TEST-WIF'
    - 'DTS-SHAREDSERVICES-DEMO-WIF'
    - 'DTS-SHAREDSERVICES-STG-WIF'
    - 'DTS-SHAREDSERVICES-PROD-WIF'
    - 'HMCTS-HUB-PROD-INTSVC-WIF'
    - 'HMCTS-HUB-NONPROD-INTSVC-WIF'
    - 'DCD-CFTAPPS-PROD-WIF'
    - 'Reform-CFT-VH-Dev'          # no WIF connection
    - 'DCD-CFT-VH-Pilot'           # no WIF connection 
    - 'DTS-HERITAGE-EXTSVC-PROD-WIF'
    - 'DTS-HERITAGE-INTSVC-PROD-WIF'
    - 'DTS-HERITAGE-EXTSVC-STG-WIF'
    - 'DTS-DATAINGEST-PROD-WIF'
    - 'MOJ DCD Atlassian LVE'      # no WIF connection 
    - 'Reform-CFT-Mgmt-WIF'
    - 'DTS-SPS-SBOX-WIF'
    - 'DTS-SPS-STG-WIF'
  - name: resourceGroup
    displayName: Resource group
    type: string

jobs:
  - job: Disable_Resource_locks
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Disable resource locks'
      inputs:
        scriptType: bash
        scriptLocation: scriptPath
        # hack to map subscription name to service connection name
        azureSubscription: ${{ parameters.subscription }}
        scriptPath: scripts/disable-resource-locking.sh
      env:
       RESOURCE_GROUPS_LIST: ${{ parameters.resourceGroup }}
