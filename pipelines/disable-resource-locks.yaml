name: "azure-resource-locks - disable"

# Docs:
# https://aka.ms/yaml
trigger: none
# Don't run against PRs
pr: none
 
parameters:
  - name: subscription
    displayName: Subscription
    type: string
    default: DCD-CNP-DEV
    values:
    - 'DCD-CNP-DEV'
    - 'DCD-CNP-QA'
    - 'DCD-CNP-PROD'
    - 'DTS-SHAREDSERVICES-DEV'
    - 'DTS-SHAREDSERVICES-TEST'
    - 'DTS-SHAREDSERVICES-DEMO'
    - 'DTS-SHAREDSERVICES-STG'
    - 'DTS-SHAREDSERVICES-PROD'
    - 'HMCTS-HUB-PROD-INTSVC'
    - 'HMCTS-HUB-NONPROD-INTSVC'
    - 'DCD-CFTAPPS-PROD'
    - 'DTS-HERITAGE-EXTSVC-PROD'
    - 'DTS-HERITAGE-INTSVC-PROD'
    - 'DTS-HERITAGE-EXTSVC-STG'
    - 'DTS-DATAINGEST-PROD'
    - 'MOJ DCD Atlassian LVE'
    - 'Reform-CFT-Mgmt'
    - 'DTS-SPS-SBOX'
    - 'DTS-SPS-STG'
  - name: resourceGroup
    displayName: Resource group
    type: string

jobs:
  - job: Disable_Resource_locks
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: 'Disable resource locks'
      inputs:
        scriptType: bash
        scriptLocation: scriptPath
        # Service connection is the subscription name plus -WIF,
        # except MOJ DCD Atlassian LVE which has no WIF connection (to be decommissioned)
        ${{ if eq(parameters.subscription, 'MOJ DCD Atlassian LVE') }}:
          azureSubscription: ${{ parameters.subscription }}
        ${{ else }}:
          azureSubscription: ${{ parameters.subscription }}-WIF
        scriptPath: scripts/disable-resource-locking.sh
      env:
       RESOURCE_GROUPS_LIST: ${{ parameters.resourceGroup }}
